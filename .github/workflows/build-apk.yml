name: Build & Release PetCare APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Prepare APK Output
        if: always()
        run: |
          mkdir -p ../dist
          find . -name "*.apk" -exec cp {} ../dist/PetCare-v1.0.0.apk \;
          cp ../build.log ../dist/build.log || true
          ls -la ../dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PetCare-APK
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0
          name: "PetCare Android App v1.0.0 (APK)"
          body: |
            ### 🐾 تطبيق PetCare الرسمي لأجهزة الأندرويد
            
            يمكنك الآن تحميل وتثبيت تطبيق PetCare مباشرة على أي هاتف يعمل بنظام أندرويد (Android).
            
            - **الإصدار:** v1.0.0
            - **اسم الحزمة:** `com.petcare.app`
            - **طريقة التثبيت:** حمّل ملف `PetCare-v1.0.0.apk` المرفق أدناه وافتحه في هاتفك، ثم اضغط "تثبيت (Install)".
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
